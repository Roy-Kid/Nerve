# The commit runs the CI job its host can — `scripts/check.py`, the same
# function `.github/workflows/ci.yml` calls.
#
#   pre-commit install
repos:
  - repo: local
    hooks:
      - id: check
        name: scripts/check.py (the CI job for this host)
        entry: python3 scripts/check.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
