# The commit runs the CI job its host can — `scripts/check.py`, the same
# function `.github/workflows/ci.yml` calls — and a push to master waits for
# every workflow to pass on the commit first (`scripts/ship.py`).
#
#   pre-commit install --hook-type pre-commit --hook-type pre-push
repos:
  - repo: local
    hooks:
      - id: check
        name: scripts/check.py (the CI job for this host)
        entry: python3 scripts/check.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ship-guard
        name: master takes only commits CI passed
        entry: python3 scripts/ship.py --pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
