# The repo's checks, run where a laptop cannot run them.
#
# The commit tier already runs fmt, clippy and a Windows `cargo check` through
# `.pre-commit-config.yaml`. What only CI can add is the tier that actually
# *executes* the Windows arms: a green `cargo test` on macOS says nothing about
# code the local target never compiles.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  unix:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

      # The commit-tier Windows gate, so a bypassed hook cannot land a
      # `cfg(windows)` arm that does not compile.
      - name: cargo check (windows target)
        run: >
          cargo check -p nerve-platform -p nerve-hub -p nerve-surface-core -p nerve-windows-surface
          --all-targets --all-features --target x86_64-pc-windows-msvc

      - name: hook mapper tests
        run: python3 sources/agents/tests/test_nerve_hook.py

      - name: VS Code surface
        working-directory: vsc-ext
        run: npm ci && npm test

      - name: site
        working-directory: index
        run: npm ci && npm test && npm run build

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # nerve-tmux-surface is unix-only by design (tmux has no Windows port),
      # so the Windows job names the portable crates rather than `--workspace`.
      - name: clippy
        run: >
          cargo clippy -p nerve-platform -p nerve-hub -p nerve-surface-core -p nerve-windows-surface
          --all-targets --all-features -- -D warnings
      - name: test
        run: >
          cargo test -p nerve-platform -p nerve-hub -p nerve-surface-core -p nerve-windows-surface
          --all-features
      - name: build Rust hub and desktop core (no GUI renderer)
        run: cargo build --release -p nerve-hub -p nerve-windows-surface --bin nerve-hub --bin nerve-windows-core

      - name: native host protocol tests
        shell: powershell
        run: |
          cargo build -p nerve-windows-surface --bin nerve-windows-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project surfaces/windows/tests/Nerve.Windows.Tests.csproj -- $PWD.Path

      - name: publish native WinUI 3 host
        run: dotnet publish surfaces/windows/Nerve.Windows.csproj -c Release -p:Platform=x64 -o package --nologo

      - name: verify the Windows ingest loop
        shell: powershell
        run: |
          Copy-Item target/release/nerve-hub.exe, target/release/nerve-windows-core.exe package/
          ./scripts/nerve.ps1 -VerifyLoop -BinaryDirectory ./package

      - name: test Windows installer helpers
        shell: powershell
        run: ./scripts/tests/nerve-windows.ps1

      - name: stage the Windows download
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force package/scripts, package/fixtures | Out-Null
          Copy-Item scripts/nerve.ps1 package/scripts/
          Copy-Item fixtures/demo_snapshot.json package/fixtures/

      - uses: actions/upload-artifact@v4
        with:
          name: nerve-windows-x64
          path: package/
          if-no-files-found: error
