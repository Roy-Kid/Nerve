# Every job is setup, then one `scripts/check.py --job <name>`: the commit hook
# runs the same function for the job its host can run, so a job here already
# ran before the push, or is one a Mac cannot run (Windows), which
# `scripts/ship.py` waits for. `scripts/test_check.py` holds this file to that.
name: CI

on:
  push:
    branches: [master, 'ci/**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check
        run: python3 scripts/check.py --job macos
      - uses: actions/upload-artifact@v7
        with:
          name: nerve-tether-macos
          path: surfaces/tether/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: nerve-tether-web
          path: surfaces/tether-web/package/
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check
        run: python scripts/check.py --job windows
      - uses: actions/upload-artifact@v7
        with:
          name: nerve-windows-x64
          path: package/
          if-no-files-found: error
