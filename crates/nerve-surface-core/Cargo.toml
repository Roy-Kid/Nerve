[package]
name = "nerve-surface-core"
description = "Everything a Nerve surface does that is not drawing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
nerve-hub = { path = "../nerve-hub", optional = true }
# Path semantics for the `openURL` half of the hook contract. `nerve-hub`
# encodes with the same module, so the two ends cannot drift.
nerve-platform = { path = "../nerve-platform" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
# Frame decoding only. A surface consumes the hub contract, it never serves.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTP and SSE are protocols with real edge cases — chunked framing that can
# split a `data:` line in half, header folding, keep-alive — so they are a
# dependency rather than something maintained here.
#
# `read_timeout` is why the async client rather than `reqwest::blocking`: it
# resets after every successful read, which is exactly what an endless SSE
# stream needs to notice a half-open socket. The blocking builder does not
# expose it, and a total budget would kill a healthy stream instead.
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
# WHATWG event-stream framing, straight off `Response::bytes_stream`.
eventsource-stream = "0.2"
# The byte type `reqwest` streams and `eventsource-stream` consumes.
bytes = "1"
futures-util = { version = "0.3", default-features = false }
# One current-thread runtime per `Hub`, private to it. No worker threads, and
# every method stays blocking to its caller.
tokio = { version = "1", features = ["rt", "time"] }
# The wire is ISO8601 second-precision `Z` (`crates/nerve-hub/src/model/time.rs`),
# so the same date library the hub already pulls in parses it here.
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }

# No terminal library and no GUI toolkit: this crate is the part of a surface
# that has no pixels. Every port it exposes is still blocking and pull-based so
# the composition root owns scheduling — the runtime below lives inside the
# transport and never reaches a UI loop.

[features]
# Frame fixtures shared by every surface's tests. Never enabled by a binary.
testkit = ["dep:nerve-hub"]

[dev-dependencies]
# The fixtures this crate's own tests read.
nerve-surface-core = { path = ".", features = ["testkit"] }
serde_json = "1"
# `tests/transport.rs` drives this crate's client against a real `nerve-hub`
# on an ephemeral port — the only place the two halves of the contract meet.
nerve-hub = { path = "../nerve-hub" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
time = { version = "0.3", features = ["macros"] }
tower = "0.5"
